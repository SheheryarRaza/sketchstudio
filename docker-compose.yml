services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sketch_backend
    restart: unless-stopped
    environment:
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    networks:
      - sketch_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sketch_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - sketch_network

networks:
  sketch_network:
    driver: bridge
