<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a3f4d" />
      <stop offset="60%" stop-color="#1f232b" />
      <stop offset="100%" stop-color="#0f1117" />
    </radialGradient>
    
    <!-- Light & Shadow Skin Gradients -->
    <linearGradient id="lightSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="40%" stop-color="#e2dcd5" />
      <stop offset="80%" stop-color="#b8afa6" />
      <stop offset="100%" stop-color="#8c8278" />
    </linearGradient>

    <linearGradient id="shadowSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a443e" />
      <stop offset="50%" stop-color="#2c2723" />
      <stop offset="100%" stop-color="#151210" />
    </linearGradient>

    <radialGradient id="foreheadLight" cx="42%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#d6ceca" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a89f99" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="coreShadow" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#38322d" />
      <stop offset="100%" stop-color="#100e0d" />
    </linearGradient>
  </defs>

  <!-- Canvas Paper Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Atelier Lighting Spotlight Atmosphere -->
  <circle cx="380" cy="400" r="380" fill="#ffffff" opacity="0.04" filter="blur(40px)" />

  <!-- Head & Shoulders Silhouette -->
  <!-- Neck & Trapezius -->
  <path d="M 280 620 L 220 900 L 580 900 L 520 620 Z" fill="#25211e" />
  <path d="M 280 620 Q 320 740 240 900 L 400 900 Q 380 720 380 620 Z" fill="url(#lightSide)" opacity="0.8" />
  
  <!-- SCM Muscle Shadow -->
  <path d="M 380 620 Q 370 720 400 900 L 580 900 L 520 620 Z" fill="url(#shadowSide)" />

  <!-- Cranium & Jaw Mass -->
  <ellipse cx="400" cy="380" rx="190" ry="230" fill="url(#lightSide)" />

  <!-- Shadow Side of Face (Terminator Line) -->
  <path d="M 400 160 Q 480 180 540 280 Q 590 380 580 480 Q 560 560 480 650 Q 420 660 380 660 Q 420 540 430 480 Q 440 430 420 370 Q 400 280 400 160 Z" fill="url(#coreShadow)" />

  <!-- Forehead Highlight -->
  <ellipse cx="370" cy="280" rx="90" ry="60" fill="url(#foreheadLight)" />

  <!-- Eyebrows & Brow Ridge -->
  <path d="M 270 340 Q 330 325 380 345 Q 330 335 270 340 Z" fill="#2b2622" />
  <path d="M 420 345 Q 470 330 520 348 Q 470 340 420 345 Z" fill="#181513" />

  <!-- Left Eye (Light Side) -->
  <!-- Eye Socket Halftone -->
  <ellipse cx="325" cy="375" rx="42" ry="24" fill="#9e938a" opacity="0.6" />
  <!-- Eye Sclera & Iris -->
  <path d="M 295 375 Q 325 358 355 375 Q 325 390 295 375 Z" fill="#f0ebe6" stroke="#524840" stroke-width="2" />
  <circle cx="325" cy="375" r="14" fill="#322923" />
  <circle cx="325" cy="375" r="6" fill="#0d0a08" />
  <circle cx="321" cy="371" r="3" fill="#ffffff" /> <!-- Cornea Highlight -->

  <!-- Right Eye (Shadow Side) -->
  <path d="M 445 375 Q 475 362 505 377 Q 475 392 445 375 Z" fill="#a3988f" opacity="0.7" stroke="#26211c" stroke-width="2" />
  <circle cx="472" cy="376" r="13" fill="#1a1512" />
  <circle cx="472" cy="376" r="5" fill="#000000" />
  <circle cx="469" cy="373" r="2" fill="#ffffff" opacity="0.6" />

  <!-- Nose Structure -->
  <!-- Nose Bridge Light -->
  <path d="M 375 345 L 368 475 L 388 475 L 385 345 Z" fill="#ffffff" opacity="0.75" />
  <!-- Nose Shadow Plane -->
  <path d="M 385 345 L 388 475 L 430 485 L 410 345 Z" fill="#3d352e" />
  <!-- Nose Tip Bulb & Nostrils -->
  <ellipse cx="378" cy="475" rx="16" ry="12" fill="#e8dfd8" />
  <circle cx="376" cy="473" r="4" fill="#ffffff" />
  <!-- Cast Shadow Under Nose -->
  <path d="M 350 482 Q 380 515 440 490 Q 400 480 350 482 Z" fill="#151210" />

  <!-- Cheekbone Highlight (Zygomatic) -->
  <ellipse cx="300" cy="430" rx="35" ry="20" fill="url(#foreheadLight)" transform="rotate(-15 300 430)" />

  <!-- Lips & Mouth Barrel -->
  <!-- Upper Lip (Downward facing shadow plane) -->
  <path d="M 330 535 Q 380 520 430 538 Q 380 545 330 535 Z" fill="#382e27" />
  <!-- Lower Lip (Upward facing light plane) -->
  <path d="M 335 538 Q 380 546 425 540 Q 380 570 335 538 Z" fill="#c4b5aa" stroke="#5a4e44" stroke-width="1.5" />
  <ellipse cx="380" cy="548" rx="20" ry="6" fill="#ffffff" opacity="0.6" />
  <!-- Cast Shadow Under Lower Lip -->
  <ellipse cx="380" cy="568" rx="28" ry="10" fill="#201a16" />

  <!-- Chin Box & Highlight -->
  <ellipse cx="380" cy="615" rx="32" ry="22" fill="url(#foreheadLight)" />
  <!-- Cast Shadow Under Chin onto Neck -->
  <path d="M 300 635 Q 380 670 470 645 Q 400 700 300 635 Z" fill="#0f0c0a" />

  <!-- Hair Mass (Classical Charcoal Textures) -->
  <path d="M 210 380 Q 200 200 360 140 Q 520 110 600 260 Q 640 420 590 540 Q 570 320 500 200 Q 380 160 270 240 Q 210 320 210 380 Z" fill="#1a1614" />
  <path d="M 230 350 Q 280 180 400 160 Q 310 200 260 300 Z" fill="#3a322c" />

  <!-- Atelier Drawing Grid Watermark -->
  <rect x="50" y="50" width="700" height="900" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-dasharray="10,10" />
</svg>
